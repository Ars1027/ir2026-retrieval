# Apple Silicon QLoRA. Loss covers only the final assistant action in each row.
model: models/student
train: true
fine_tune_type: lora
optimizer: adamw
data: artifacts/posttraining/data
seed: 2026
num_layers: 16
batch_size: 1
grad_accumulation_steps: 1
iters: 240
val_batches: -1
learning_rate: 0.0001
steps_per_report: 10
steps_per_eval: 40
adapter_path: artifacts/posttraining/adapter
save_every: 40
max_seq_length: 4096
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 16.0
